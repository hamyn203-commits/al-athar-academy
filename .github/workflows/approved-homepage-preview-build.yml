name: Approved Homepage Preview Build

on:
  push:
    branches:
      - design/approved-wahy-namaa-homepage
      - design/wahy-namaa-v2-immersive
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint approved redesign files
        run: >
          npx eslint
          src/components/WahyNamaaEmblem.jsx
          src/components/BrandLogo.jsx
          src/components/GlobalHeader.jsx
          src/components/GlobalFooter.jsx
          src/pages/NewLandingPage/index.jsx
          src/pages/NewLandingPage/sections/HeroSection.jsx
          src/pages/NewLandingPage/sections/ProgramsSection.jsx
          src/pages/NewLandingPage/sections/WhyWahyNamaaSection.jsx
          src/pages/NewLandingPage/sections/ImmersiveLearningSection.jsx
          src/pages/NewLandingPage/sections/LearningExperienceSection.jsx
          src/pages/NewLandingPage/sections/StudentJourneySection.jsx
          src/pages/NewLandingPage/sections/TeachersSection.jsx
          src/pages/NewLandingPage/sections/TargetAudiencesSection.jsx
          src/pages/NewLandingPage/sections/CTASection.jsx
          src/components/MobileStickyBar.jsx

      - name: Build frontend
        run: npx vite build

      - name: Upload built preview
        uses: actions/upload-artifact@v4
        with:
          name: approved-homepage-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
