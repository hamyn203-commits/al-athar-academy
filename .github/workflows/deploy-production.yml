name: Production Verification

# Both frontend and backend deploy automatically from master through Vercel Git.
# This manual workflow verifies the active production stack without a second deploy path.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Vercel Frontend + API
    runs-on: ubuntu-latest
    steps:
      - name: API readiness
        run: |
          body=$(curl --fail --silent --show-error https://wahy-wa-namaa-api.vercel.app/api/readiness)
          echo "$body"
          echo "$body" | grep -q '"ready":true'

      - name: API through frontend rewrite
        run: |
          body=$(curl --fail --silent --show-error https://wahy-wa-namaa-academy.vercel.app/api/readiness)
          echo "$body"
          echo "$body" | grep -q '"ready":true'

      - name: Frontend
        run: curl --fail --silent --show-error -o /dev/null https://wahy-wa-namaa-academy.vercel.app/ar

      - name: Summary
        run: |
          echo "### Production verification passed ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: https://wahy-wa-namaa-academy.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://wahy-wa-namaa-api.vercel.app" >> "$GITHUB_STEP_SUMMARY"
