name: Legacy Azure Backend Deploy (Manual Only)

# Production backend now deploys through the native Vercel Git integration.
# Keep this workflow only as a historical rollback path if Azure is intentionally restored.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy deployment notice
        run: |
          echo "Azure automatic deployment is retired."
          echo "Active API: https://wahy-wa-namaa-api.vercel.app"
          echo "Use the Vercel Git integration for production backend deployments."
