name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — build + advisory lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Production safety scan
        run: npm run safety:production

      - name: Route navigation contracts
        run: npm run test:routes

      - name: Build
        run: npm run build --ignore-scripts

      - name: Lint (technical-debt report)
        continue-on-error: true
        run: npm run lint

  backend:
    name: Backend — install & syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Syntax check
        working-directory: backend
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Security regression gate
        working-directory: backend
        run: npm run test:security

      - name: Integration test gate
        working-directory: backend
        run: npm test