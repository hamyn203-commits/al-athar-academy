name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — build + advisory lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Lockfile consistency
        run: |
          git diff -- package-lock.json
          git diff --exit-code -- package-lock.json

      - name: Production safety scan
        run: npm run safety:production

      - name: Route navigation contracts
        run: npm run test:routes

      - name: Teacher upload recovery tests
        run: node --test scripts/teacher-upload-queue.test.mjs

      - name: Build
        run: npm run build --ignore-scripts

      - name: Lint (technical-debt report)
        continue-on-error: true
        run: npm run lint

  e2e:
    name: Playwright — core academy journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/wahy_playwright?replicaSet=rs0&directConnection=true
      JWT_SECRET: playwright-access-secret-0123456789-abcdef
      JWT_REFRESH_SECRET: playwright-refresh-secret-9876543210-fedcba
      DISABLE_RATE_LIMIT: 'true'
      ENABLE_IN_PROCESS_SCHEDULER: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend and Playwright
        run: npm install --no-audit --no-fund

      - name: Install backend
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start transaction-capable test database
        run: |
          docker run -d --name wahy-mongo-e2e -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec wahy-mongo-e2e mongosh --quiet --eval 'db.runCommand({ ping: 1 })' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec wahy-mongo-e2e mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec wahy-mongo-e2e mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec wahy-mongo-e2e mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Concurrent subscription settlement regression
        run: node backend/scripts/test-subscription-settlement.cjs

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  backend:
    name: Backend — install & syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Syntax check
        working-directory: backend
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print0 \
            | xargs -0 -r -n1 node --check

      - name: Security regression gate
        working-directory: backend
        run: npm run test:security

      - name: Integration test gate
        working-directory: backend
        run: npm test
