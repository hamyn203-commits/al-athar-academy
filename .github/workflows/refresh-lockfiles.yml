name: Refresh npm lockfiles

on:
  push:
    branches: [master]
    paths:
      - package.json
      - backend/package.json
      - .github/workflows/refresh-lockfiles.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh frontend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Refresh backend lockfile
        working-directory: backend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfiles if changed
        run: |
          if git diff --quiet -- package-lock.json backend/package-lock.json; then
            echo "Lockfiles already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json backend/package-lock.json
          git commit -m "chore: refresh npm lockfiles"
          git push
