name: Vercel API — Smoke Test

on:
  workflow_dispatch:
    inputs:
      require_ready:
        description: Fail unless backend is fully ready for cutover
        required: true
        default: false
        type: boolean

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test candidate API
        working-directory: backend
        env:
          API_URL: https://wahy-wa-namaa-api.vercel.app
          REQUIRE_READY: ${{ inputs.require_ready }}
        run: node scripts/smoke.mjs
