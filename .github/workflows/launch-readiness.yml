name: Launch Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Public launch gate
    runs-on: ubuntu-latest
    steps:
      - name: Core production readiness
        run: |
          body=$(curl --fail --silent --show-error https://wahy-wa-namaa-api.vercel.app/api/readiness)
          echo "$body"
          echo "$body" | grep -q '"ready":true'

      - name: Commercial launch readiness
        run: |
          body=$(curl --silent --show-error https://wahy-wa-namaa-api.vercel.app/api/launch-readiness)
          echo "$body"
          echo "$body" | grep -q '"ready":true'

      - name: Frontend
        run: curl --fail --silent --show-error -o /dev/null https://wahy-wa-namaa-academy.vercel.app/ar

      - name: Summary
        run: |
          echo "### Public launch gate passed ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "Core runtime and commercial launch readiness both reported ready." >> "$GITHUB_STEP_SUMMARY"
