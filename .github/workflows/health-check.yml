name: Health Check (Production)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: API + Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Backend readiness
        run: |
          body=$(curl --fail --silent --show-error https://wahy-wa-namaa-api.vercel.app/api/readiness)
          echo "$body"
          echo "$body" | grep -q '"ready":true'

      - name: Frontend home
        run: curl --fail --silent --show-error -o /dev/null -w "HTTP %{http_code}\n" https://wahy-wa-namaa-academy.vercel.app/ar

      - name: Frontend API rewrite
        run: |
          body=$(curl --fail --silent --show-error https://wahy-wa-namaa-academy.vercel.app/api/readiness)
          echo "$body"
          echo "$body" | grep -q '"ready":true'

      - name: API teachers
        run: curl --fail --silent --show-error 'https://wahy-wa-namaa-api.vercel.app/api/teachers?limit=1' | grep -q '"teachers"'

      - run: echo "### All production checks passed ✅" >> "$GITHUB_STEP_SUMMARY"
