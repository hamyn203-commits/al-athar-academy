name: Homepage Visual Screenshot
# Visual review helper for the approved design branch.

on:
  push:
    branches:
      - design/approved-wahy-namaa-homepage
      - design/wahy-namaa-v2-immersive
      - design/wahy-namaa-v3-final
      - design/wahy-namaa-v3-motion-final

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npx vite build

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview server
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ar >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1

      - name: Capture desktop and mobile after reveal
        run: |
          cat > /tmp/capture-homepage.mjs <<'NODE'
          import { chromium } from 'playwright';

          async function revealAndCapture(page, url, path) {
            await page.goto(url, { waitUntil: 'networkidle' });
            await page.evaluate(async () => {
              const step = Math.max(420, window.innerHeight * 0.72);
              for (let y = 0; y < document.documentElement.scrollHeight; y += step) {
                window.scrollTo(0, y);
                await new Promise((resolve) => setTimeout(resolve, 140));
              }
              window.scrollTo(0, document.documentElement.scrollHeight);
              await new Promise((resolve) => setTimeout(resolve, 500));
              window.scrollTo(0, 0);
            });
            await page.waitForTimeout(350);
            await page.screenshot({ path, fullPage: true });
          }

          const browser = await chromium.launch();

          const desktop = await browser.newPage({ viewport: { width: 1600, height: 1000 } });
          await revealAndCapture(desktop, 'http://127.0.0.1:4173/ar', 'wahy-namaa-homepage.png');

          const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, isMobile: true, hasTouch: true });
          await revealAndCapture(mobile, 'http://127.0.0.1:4173/ar', 'wahy-namaa-homepage-mobile.png');

          await browser.close();
          NODE
          node /tmp/capture-homepage.mjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wahy-namaa-homepage-screenshot
          path: |
            wahy-namaa-homepage.png
            wahy-namaa-homepage-mobile.png
          if-no-files-found: error
          retention-days: 1
